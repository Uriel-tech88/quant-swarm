strategy:
  id: atr_trailing_stop
  name: Chandelier ATR Trailing Stop Overlay
  source_paper:
    title: "151 Trading Strategies"
    authors: [Zura Kakushadze, Juan Andres Serur]
    arxiv_id: "1803.09734"
    ssrn_id: "3247865"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865"
    published_date: "2018-08-13"
    categories: [q-fin.TR, q-fin.PM, q-fin.ST]
  asset_class: multi-asset
  timeframe: 1h
  strategy_type: momentum
  horizon: intraday
  logic:
    description: "Risk-management overlay (stop-loss family) of SSRN 3247865, implemented in backtests/strategy_library.py"
    entry_rules:
      - "Close above SMA20 -> enter long"
      - "Trailing stop = highest close - 3*ATR14"
    exit_rules:
      - "Close crosses below trailing stop -> exit"
    position_size: "fixed 1 unit per symbol (xsec uses 1/N per leg)"
    risk_controls: ["5bps cost per position change", "hourly rebalance"]
  parameters:
    - {name: atr_period, type: int, default: 14, range: [7, 30], description: "atr_period parameter"}
    - {name: mult, type: float, default: 3.0, range: [2.0, 5.0], description: "mult parameter"}
  data_requirements:
    source: "yfinance 1m via data/pipeline_finmlkit.py"
    symbols: "all 12 swarm symbols (FX, GC=F gold, indices, synthetics)"
    lookback_days: 7
  implementation:
    module: "backtests/strategy_library.py"
    function: "sig_atr_trailing_stop"
    runner: "swarm_run.py stage strategies"
  status: implemented
  backtested: true
