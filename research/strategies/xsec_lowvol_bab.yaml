strategy:
  id: xsec_lowvol_bab
  name: Cross-Sectional Low-Volatility (BAB-style)
  source_paper:
    title: "151 Trading Strategies"
    authors: [Zura Kakushadze, Juan Andres Serur]
    arxiv_id: "1803.09734"
    ssrn_id: "3247865"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865"
    published_date: "2018-08-13"
    categories: [q-fin.TR, q-fin.PM, q-fin.ST]
  asset_class: multi-asset
  timeframe: 1h
  strategy_type: cross_sectional
  horizon: intraday
  logic:
    description: "Low-volatility anomaly (Frazzini & Pedersen 2014): long 3 quietest, short 3 wildest by past-week realized vol"
    entry_rules:
      - "Rank universe by 168h realized vol"
      - "Long bottom-3 vol, short top-3 vol, equal weight"
    exit_rules:
      - "Hourly re-rank"
    position_size: "fixed 1 unit per symbol (xsec uses 1/N per leg)"
    risk_controls: ["5bps cost per position change", "hourly rebalance"]
  parameters:
    - {name: lookback, type: int, default: 168, range: [72, 336], description: "lookback parameter"}
    - {name: n, type: int, default: 3, range: [2, 5], description: "n parameter"}
  data_requirements:
    source: "yfinance 1m via data/pipeline_finmlkit.py"
    symbols: "all 12 swarm symbols (FX, GC=F gold, indices, synthetics)"
    lookback_days: 7
  implementation:
    module: "backtests/strategy_library.py"
    function: "backtest_xsec_lowvol"
    runner: "swarm_run.py stage strategies | research/strategy_forge.py"
  status: implemented
  backtested: true
