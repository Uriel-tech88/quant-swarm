strategy:
  id: tsmom_vol_scaled
  name: Time-Series Momentum with Volatility Scaling
  source_paper:
    title: "151 Trading Strategies"
    authors: [Zura Kakushadze, Juan Andres Serur]
    arxiv_id: "1803.09734"
    ssrn_id: "3247865"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865"
    published_date: "2018-08-13"
    categories: [q-fin.TR, q-fin.PM, q-fin.ST]
  asset_class: multi-asset
  timeframe: 1h
  strategy_type: momentum
  horizon: intraday
  logic:
    description: "TSMOM (Moskowitz, Ooi & Pedersen 2012, JFE): sign of past 72h return, sized by target/realized vol"
    entry_rules:
      - "Long when 72h return > 0, short when < 0"
      - "Position size = 10% target vol / realized vol (cap 3x)"
    exit_rules:
      - "Signal flips sign"
    position_size: "fixed 1 unit per symbol (xsec uses 1/N per leg)"
    risk_controls: ["5bps cost per position change", "hourly rebalance"]
  parameters:
    - {name: lookback, type: int, default: 72, range: [24, 240], description: "lookback parameter"}
    - {name: target_vol, type: float, default: 0.1, range: [0.05, 0.25], description: "target_vol parameter"}
  data_requirements:
    source: "yfinance 1m via data/pipeline_finmlkit.py"
    symbols: "all 12 swarm symbols (FX, GC=F gold, indices, synthetics)"
    lookback_days: 7
  implementation:
    module: "backtests/strategy_library.py"
    function: "sig_tsmom_vol_scaled"
    runner: "swarm_run.py stage strategies | research/strategy_forge.py"
  status: implemented
  backtested: true
