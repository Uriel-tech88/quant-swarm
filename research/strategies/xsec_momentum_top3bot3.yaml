strategy:
  id: xsec_momentum_top3bot3
  name: Cross-Sectional Momentum (Long Top 3 / Short Bottom 3)
  source_paper:
    title: "151 Trading Strategies"
    authors: [Zura Kakushadze, Juan Andres Serur]
    arxiv_id: "1803.09734"
    ssrn_id: "3247865"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865"
    published_date: "2018-08-13"
    categories: [q-fin.TR, q-fin.PM, q-fin.ST]
  asset_class: multi-asset
  timeframe: 1h
  strategy_type: momentum
  horizon: intraday
  logic:
    description: "Section 3.3 Cross-Sectional Momentum of SSRN 3247865, implemented in backtests/strategy_library.py"
    entry_rules:
      - "Rank all 12 symbols by trailing 48h return each hour"
      - "Long top 3 equal-weight, short bottom 3 equal-weight"
    exit_rules:
      - "Hourly re-ranking (continuous rotation)"
    position_size: "fixed 1 unit per symbol (xsec uses 1/N per leg)"
    risk_controls: ["5bps cost per position change", "hourly rebalance"]
  parameters:
    - {name: lookback, type: int, default: 48, range: [24, 240], description: "lookback parameter"}
    - {name: top_n, type: int, default: 3, range: [2, 5], description: "top_n parameter"}
  data_requirements:
    source: "yfinance 1m via data/pipeline_finmlkit.py"
    symbols: "all 12 swarm symbols (FX, GC=F gold, indices, synthetics)"
    lookback_days: 7
  implementation:
    module: "backtests/strategy_library.py"
    function: "backtest_xsec_momentum"
    runner: "swarm_run.py stage strategies"
  status: implemented
  backtested: true
