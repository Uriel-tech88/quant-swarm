strategy:
  id: kalman_gld_slv
  name: Kalman-Filter Dynamic Hedge Ratio (GLD/SLV)
  source_paper:
    title: "151 Trading Strategies"
    authors: [Zura Kakushadze, Juan Andres Serur]
    arxiv_id: "1803.09734"
    ssrn_id: "3247865"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865"
    published_date: "2018-08-13"
    categories: [q-fin.TR, q-fin.PM, q-fin.ST]
  asset_class: multi-asset
  timeframe: 1h
  strategy_type: stat_arb
  horizon: intraday
  logic:
    description: "Kalman-filtered time-varying beta of log(GLD) on log(SLV); trade residual spread z-score (SSRN stat-arb/Kalman family)"
    entry_rules:
      - "Spread z < -1.5 -> long spread"
      - "Spread z > +1.5 -> short spread"
    exit_rules:
      - "|z| < 0.25"
    position_size: "fixed 1 unit per symbol (xsec uses 1/N per leg)"
    risk_controls: ["5bps cost per position change", "hourly rebalance"]
  parameters:
    - {name: delta, type: float, default: 0.0001, range: [1e-05, 0.001], description: "delta parameter"}
    - {name: R, type: float, default: 0.001, range: [0.0001, 0.01], description: "R parameter"}
  data_requirements:
    source: "yfinance 1m via data/pipeline_finmlkit.py"
    symbols: "all 12 swarm symbols (FX, GC=F gold, indices, synthetics)"
    lookback_days: 7
  implementation:
    module: "backtests/strategy_library.py"
    function: "backtest_kalman_pair"
    runner: "swarm_run.py stage strategies | research/strategy_forge.py"
  status: implemented
  backtested: true
