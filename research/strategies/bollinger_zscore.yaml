strategy:
  id: bollinger_zscore
  name: Bollinger Band Z-Score Mean Reversion
  source_paper:
    title: "151 Trading Strategies"
    authors: [Zura Kakushadze, Juan Andres Serur]
    arxiv_id: "1803.09734"
    ssrn_id: "3247865"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865"
    published_date: "2018-08-13"
    categories: [q-fin.TR, q-fin.PM, q-fin.ST]
  asset_class: multi-asset
  timeframe: 1h
  strategy_type: mean_reversion
  horizon: intraday
  logic:
    description: "Section 4.2 Mean Reversion of SSRN 3247865, implemented in backtests/strategy_library.py"
    entry_rules:
      - "Z-score < -2 -> long"
      - "Z-score > +2 -> short"
    exit_rules:
      - "Z-score reverts inside +/-0.5 -> flat"
    position_size: "fixed 1 unit (vol-targeted where noted)"
    risk_controls: ["5bps cost per position change", "hourly rebalance", "leverage cap 3x on vol-target"]
  parameters:
    - {name: period, type: int, default: 20, range: [10, 50], description: "period parameter"}
    - {name: entry_z, type: float, default: 2.0, range: [1.5, 3.0], description: "entry_z parameter"}
  data_requirements:
    source: "yfinance 1m via data/pipeline_finmlkit.py"
    symbols: "all swarm symbols (FX, GC=F gold, indices, synthetics)"
    lookback_days: 7
  implementation:
    module: "backtests/strategy_library.py"
    function: "sig_bollinger_zscore"
    runner: "swarm_run.py stage strategies"
  status: implemented
  backtested: true
