strategy:
  id: donchian_breakout
  name: Donchian Channel Breakout (Turtle-style)
  source_paper:
    title: "151 Trading Strategies"
    authors: [Zura Kakushadze, Juan Andres Serur]
    arxiv_id: "1803.09734"
    ssrn_id: "3247865"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865"
    published_date: "2018-08-13"
    categories: [q-fin.TR, q-fin.PM, q-fin.ST]
  asset_class: multi-asset
  timeframe: 1h
  strategy_type: momentum
  horizon: intraday
  logic:
    description: "Section 3.2 Breakout of SSRN 3247865, implemented in backtests/strategy_library.py"
    entry_rules:
      - "Close breaks above 20-bar high -> long"
      - "Close breaks below 20-bar low -> short"
    exit_rules:
      - "Price returns to channel mid"
    position_size: "fixed 1 unit (vol-targeted where noted)"
    risk_controls: ["5bps cost per position change", "hourly rebalance", "leverage cap 3x on vol-target"]
  parameters:
    - {name: window, type: int, default: 20, range: [10, 55], description: "window parameter"}
  data_requirements:
    source: "yfinance 1m via data/pipeline_finmlkit.py"
    symbols: "all swarm symbols (FX, GC=F gold, indices, synthetics)"
    lookback_days: 7
  implementation:
    module: "backtests/strategy_library.py"
    function: "sig_donchian_breakout"
    runner: "swarm_run.py stage strategies"
  status: implemented
  backtested: true
