strategy:
  id: ema_crossover
  name: EMA 9/21 Crossover Trend Following
  source_paper:
    title: "151 Trading Strategies"
    authors: [Zura Kakushadze, Juan Andres Serur]
    arxiv_id: "1803.09734"
    ssrn_id: "3247865"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865"
    published_date: "2018-08-13"
    categories: [q-fin.TR, q-fin.PM, q-fin.ST]
  asset_class: multi-asset
  timeframe: 1h
  strategy_type: momentum
  horizon: intraday
  logic:
    description: "Section 3.1 Moving Average Crossover of SSRN 3247865, implemented in backtests/strategy_library.py"
    entry_rules:
      - "EMA(9) crosses above EMA(21) -> long"
      - "EMA(9) below EMA(21) -> short"
    exit_rules:
      - "Opposite cross"
    position_size: "fixed 1 unit per symbol (xsec uses 1/N per leg)"
    risk_controls: ["5bps cost per position change", "hourly rebalance"]
  parameters:
    - {name: fast, type: int, default: 9, range: [5, 20], description: "fast parameter"}
    - {name: slow, type: int, default: 21, range: [15, 60], description: "slow parameter"}
  data_requirements:
    source: "yfinance 1m via data/pipeline_finmlkit.py"
    symbols: "all 12 swarm symbols (FX, GC=F gold, indices, synthetics)"
    lookback_days: 7
  implementation:
    module: "backtests/strategy_library.py"
    function: "sig_ema_crossover"
    runner: "swarm_run.py stage strategies"
  status: implemented
  backtested: true
